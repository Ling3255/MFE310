base_config: 01_configs/01_base.yaml
output_dir: 08_runs/baseline_tfidf_lr
validation_results_dir: 09_results/01_validation
vectorizer:
  analyzer: word
  ngram_range: [1, 2]
  lowercase: true
  min_df: 1
  max_df: 1.0
  norm: l2
  sublinear_tf: false
  strip_accents: null
logistic_regression:
  solver: lbfgs
  max_iter: 2000
  random_state: 0
  n_jobs: 1
c_grid: [0.1, 1.0, 10.0, 100.0]
selection_metric: macro_f1
