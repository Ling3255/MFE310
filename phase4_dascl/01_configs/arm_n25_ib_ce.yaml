# Phase 4 arm ib_ce, 25-shot: intent-balanced batches (8 intents x 4); loss = CE.
# Identical to the other three arms except sampler and/or loss. Do not edit after training starts (config hash).
experiment: clinc150_domain_auxiliary
seed_analysis: 20261024
data:
  root: ../dataset/clinc_phase3/n25
  full_file: data_full.json
  domains_file: domains.json
  splits:
  - train
  - val
  - test
  - oos_train
  - oos_val
  - oos_test
  in_scope_splits:
  - train
  - val
  - test
  oos_splits:
  - oos_train
  - oos_val
  - oos_test
  train_split: train
  validation_split: val
  test_split: test
  oos_validation_split: oos_val
  oos_test_split: oos_test
  expected_counts: null
  expected_per_intent: null
  strict_counts: false
metadata_dir: 07_metadata
runs_dir: phase4_dascl/08_runs/n25_ib_ce
results_dir: phase4_dascl/09_results
model:
  name: google-bert/bert-base-uncased
  revision: 86b5e0934494bd15c9632b12f734a8a67f723594
  num_intents: 150
  num_domains: 10
  dropout: 0.1
  max_length: 64
  inference_dtype: float32
training:
  learning_rate: 2.0e-05
  weight_decay: 0.01
  epochs: 20
  patience: 3
  effective_batch_size: 32
  micro_batch_size: 32
  gradient_accumulation: 1
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  num_workers: 0
  deterministic: true
  amp: false
  device: auto
  local_gpu_approval_record: 07_metadata/local_gpu_approval.md
  initialization_dir: ../../init
  best_checkpoint_weights_only: true
  keep_last_checkpoint: false
  sampler: class_balanced
  classes_per_batch: 8
  samples_per_class: 4
selection:
  metric: macro_f1
  tolerance: 0.002
  bootstrap_iterations: 1000
  bootstrap_seed: 20261024
  bootstrap_samples_per_intent: 30
  cases_per_category: 5
  case_seed: 20261024
optional_analyses:
  domain_head_score: false
  representation_visualization: false
  oos_false_acceptance_destinations: true
